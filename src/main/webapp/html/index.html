<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="login-container">
    <h2>ToetsPortaal Inloggen</h2>

    <form>
        <label for="firstname">Voornaam</label>
        <input type="text" id="firstname" placeholder="Voer voornaam in">

        <label for="lastname">Achternaam</label>
        <input type="text" id="lastname" placeholder="Voer achternaam in">

        <label for="email">E-Mail</label>
        <input type="text" id="email" placeholder="Voer emailsnaam in">

        <label for="password">Wachtwoord</label>
        <input type="password" id="password" placeholder="Voer wachtwoord in">

        <button type="submit">Inloggen</button>
    </form>
</div>

</body>
</html>
